name: demolition

services:
  demolition:
    build:
      context: .
    init: true
    restart: unless-stopped
    user: "${DEMOLITION_UID:-1000}:${DEMOLITION_GID:-1000}"
    environment:
      DEMOLITION_API_HOST: 0.0.0.0
      DEMOLITION_PROXY_TOKEN: ${DEMOLITION_PROXY_TOKEN:?Set DEMOLITION_PROXY_TOKEN in .env.server}
      TZ: ${TZ:-Australia/Brisbane}
    volumes:
      - ${DEMOLITION_DATA_DIR:-/srv/demolition/data}:/app/data
    expose:
      - "3000"
      - "3001"
    ports:
      - "${DEMOLITION_WIREGUARD_IP:?Set DEMOLITION_WIREGUARD_IP in .env.server}:3001:3001/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      demolition:
        condition: service_healthy
    environment:
      DEMOLITION_HOSTNAME: ${DEMOLITION_HOSTNAME:-demolition.home.arpa}
      DEMOLITION_PROXY_TOKEN: ${DEMOLITION_PROXY_TOKEN:?Set DEMOLITION_PROXY_TOKEN in .env.server}
    ports:
      - "${DEMOLITION_WIREGUARD_IP:?Set DEMOLITION_WIREGUARD_IP in .env.server}:443:443/tcp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEMOLITION_CADDY_DATA_DIR:-/srv/demolition/caddy-data}:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_config:
