name: demolition

services:
  demolition:
    image: ${DEMOLITION_IMAGE:-ghcr.io/joshtrim/demolition:0.1.3}
    init: true
    restart: unless-stopped
    user: "${DEMOLITION_UID:-1000}:${DEMOLITION_GID:-1000}"
    environment:
      DEMOLITION_API_HOST: 0.0.0.0
      DEMOLITION_ALLOW_LAN: ${DEMOLITION_ALLOW_LAN:-false}
      DEMOLITION_DATABASE_PATH: /app/database/demolition.sqlite
      DEMOLITION_PROXY_TOKEN: ${DEMOLITION_PROXY_TOKEN:?Set DEMOLITION_PROXY_TOKEN in .env}
      NEXT_PUBLIC_DEMOLITION_API_PORT: ${DEMOLITION_API_PORT:?Set DEMOLITION_API_PORT in .env}
      NEXT_PUBLIC_DEMOLITION_UI_PORT: ${DEMOLITION_UI_PORT:?Set DEMOLITION_UI_PORT in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DEMOLITION_DATA_DIR:-/srv/demolition/data}:/app/data
      - ${DEMOLITION_DATABASE_DIR:?Set DEMOLITION_DATABASE_DIR in .env}:/app/database
    ports:
      - "${DEMOLITION_BIND_ADDRESS:-127.0.0.1}:${DEMOLITION_UI_PORT:?Set DEMOLITION_UI_PORT in .env}:3000/tcp"
      - "${DEMOLITION_BIND_ADDRESS:-127.0.0.1}:${DEMOLITION_API_PORT:?Set DEMOLITION_API_PORT in .env}:3001/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
